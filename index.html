<!DOCTYPE html>
<html>
<head>
    <title>NexaPay</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script> <!-- 1. Sanya wannan a nan -->
</head>
<body>
    <h1>Welcome to NexaPay</h1>
    <p>Simple and convenient digital payment services powered by PI</p>

    <!-- 2. Sanya button din nan -->
    <button onclick="signInWithPi()" style="background:purple; color:white; padding:12px 24px; border:none; border-radius:8px; font-size:16px;">
      Shiga da Pi
    </button>

    <!-- 3. Sanya script din nan a kasa kafin </body> -->
    <script>
      Pi.init({ version: "2.0", sandbox: true })

      function signInWithPi() {
        const izini = ['username', 'payments'];
        
        Pi.authenticate(izini, idanAkwaiBiyanDaBaiKareBa).then(function(bayani) {
          alert("Barka da zuwa " + bayani.user.username);
        }).catch(function(kuskure) {
          alert("Ba a iya shiga ba: " + kuskure);
        });
      }

      function idanAkwaiBiyanDaBaiKareBa(biya) {
        console.log("Akwai wani biya da bai kare ba: ", biya);
      }
    </script>
</body>
</html>
