<!DOCTYPE html>
<html>
<head>
    <title>NexaPay</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align:center; padding-top:100px;">
    <h1 style="color:purple;">Welcome to NexaPay</h1>
    <p>Simple and convenient digital payment services powered by PI</p>

    <button onclick="signInWithPi()" style="background:purple; color:white; padding:12px 24px; border:none; border-radius:8px; font-size:16px;">
      Sign in with Pi
    </button>

    <script>
      Pi.init({ version: "2.0", sandbox: true })

      function signInWithPi() {
        const scopes = ['username', 'payments'];
        Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
          // HERE IS THE IMPORTANT PART
          const username = auth.user.username;
          console.log("Logged in as: " + username);
          window.location.href = "dashboard.html?user=" + username;
          
        }).catch(function(error) {
          alert("Login failed: " + error);
        });
      }

      function onIncompletePaymentFound(payment) {
        console.log("Incomplete payment: ", payment);
      }
    </script>
</body>
</html>
