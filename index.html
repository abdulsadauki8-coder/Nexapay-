<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaPay</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3fa;
      color: #222;
    }

    .header {
      background: #6f3fa0;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6f3fa0;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .service {
      padding: 15px;
      margin: 10px 0;
      background: #f1eafa;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🟣 NexaPay</h1>
    <p>Fast & Secure Pi Payments</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>Welcome to NexaPay</h2>
      <p>Simple and convenient digital payment services powered by Pi.</p>

      <button id="loginBtn">
        Sign in with Pi
      </button>
    </div>

    <div class="card">
      <h2>Services</h2>

      <div class="service">📱 Airtime</div>
      <div class="service">🌐 Data</div>
      <div class="service">🟣 Pi Payments</div>
      <div class="service">🧾 Transaction History</div>

    </div>

  </div>

  <script>
    document.getElementById("loginBtn").addEventListener("click", function() {
      alert("Pi Login will be connected here.");
    });
  </script>

</body>
</html>
