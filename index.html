<!DOCTYPE html>
<html>
<head>
    <title>NexaPay Dashboard</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f5f5f5; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: purple; }
        .balance { font-size: 32px; font-weight: bold; color: green; }
        .logout-btn { margin-top:20px; background:gray; color:white; padding:10px 20px; border:none; border-radius:8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to Your Dashboard</h1>
        <p id="welcome">Loading your info...</p>
        
        <h3>Your Pi Balance</h3>
        <p class="balance">0.00 Pi</p>
        <p><small>This is test mode - sandbox</small></p>

        <button onclick="window.location.href='index.html'" class="logout-btn">
            Logout
        </button>
    </div>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
        Pi.init({ version: "2.0", sandbox: true })
        
        // Get username from URL
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user');
        
        if(username) {
            document.getElementById('welcome').innerText = "Welcome, " + username + "!";
        }
    </script>
</body>
</html>
