<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  // Initialize Pi SDK
  Pi.init({ 
    version: "2.0", 
    sandbox: true // bar shi true har sai ka tura app zuwa production
  });

  // Function da ke gudana lokacin da aka danna button
  function signInWithPi() {
    const scopes = ['username', 'payments']; // Abin da muke nema daga Pi

    Pi.authenticate(scopes, onIncompletePaymentFound)
      .then(function(auth) {
        // Idan ya yi nasara
        const username = auth.user.username;
        const userId = auth.user.uid;
        console.log("Login Success:", username);
        
        // MU TURASHI DASHBOARD - Dole mu yi haka
        window.location.href = "/dashboard.html?user=" + username;
        
      })
      .catch(function(error) {
        // Idan ya yi kuskure
        console.error("Login Error:", error);
        alert("Login failed: " + error);
      });
  }

  // Wannan yana kula da biyan da ba a gama ba
  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment found:", payment);
  }
</script>
