<script>
  const Pi = window.Pi;

  Pi.init({
    version: "2.0",
    sandbox: true
  });

  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment found:", payment);
    showMessage("An incomplete Pi payment was found.");
  }

  async function loginWithPi() {
    const button = document.getElementById("loginBtn");
    button.disabled = true;
    button.innerText = "Connecting to Pi...";

    try {
      const scopes = ["username", "payments"];
      const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);

      const username = auth.user.username;
      console.log("Pi authentication successful:", auth);

      showMessage("Login successful! Redirecting...");
      
      // WANNAN SABON LAYIN SHINE ZAI KA DASHBOARD
      setTimeout(() => {
        window.location.href = "/dashboard.html?user=" + username;
      }, 1000);

    } catch (error) {
      console.error("Pi authentication error:", error);
      showMessage("Login failed. Dole ne ka bude app din a cikin Pi Browser.");
      button.disabled = false;
      button.innerText = "Sign in with Pi";
    }
  }

  function showMessage(text) {
    const box = document.getElementById("message");
    box.innerText = text;
    box.style.display = "block";
  }

  function logoutUser() {
    document.getElementById("userBox").style.display = "none";
    document.getElementById("loginBtn").style.display = "block";
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginBtn").innerText = "Sign in with Pi";
    showMessage("You have been signed out.");
  }
</script>
