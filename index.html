<script>
  let Pi = null;
  let accessToken = null;
  let currentUser = null;

  // Jira Pi SDK ya load
  if (window.Pi) {
    Pi = window.Pi;

    Pi.init({
      version: "2.0",
      sandbox: true
    });

    console.log("Pi SDK successfully loaded");
  } else {
    console.error("Pi SDK bai load ba");
  }


  // Sign in with Pi
  async function loginWithPi() {

    const button = document.getElementById("loginBtn");

    if (!Pi) {
      showMessage(
        "Pi SDK bai load ba. Ka bude app din a cikin Pi Browser."
      );
      return;
    }

    button.disabled = true;
    button.innerText = "Connecting to Pi...";

    try {

      const scopes = [
        "username",
        "payments"
      ];

      const auth = await Pi.authenticate(
        scopes,
        onIncompletePaymentFound
      );

      accessToken = auth.accessToken;
      currentUser = auth.user;

      console.log("Login successful:", auth);

      document.getElementById("username").innerText =
        currentUser.username;

      document.getElementById("userBox").style.display =
        "block";

      button.style.display = "none";

      showMessage(
        "Welcome to NexaPay, " +
        currentUser.username + "!"
      );

    } catch (error) {

      console.error("Pi Login Error:", error);

      showMessage(
        "Sign in failed. Ka tabbatar kana bude NexaPay a Pi Browser."
      );

      button.disabled = false;
      button.innerText = "Sign in with Pi";
    }
  }


  // Incomplete payment
  function onIncompletePaymentFound(payment) {

    console.log(
      "Incomplete payment:",
      payment
    );
  }


  // Show message
  function showMessage(text) {

    const box =
      document.getElementById("message");

    box.innerText = text;

    box.style.display = "block";
  }


  // Sign out
  function logoutUser() {

    accessToken = null;
    currentUser = null;

    document.getElementById("userBox").style.display =
      "none";

    const button =
      document.getElementById("loginBtn");

    button.style.display = "block";
    button.disabled = false;
    button.innerText = "Sign in with Pi";

    showMessage("You have signed out.");
  }

</script>
